# .github/workflows/ci.yml
#
# CI for angeo/module-aeo-audit.
#
# Key trick: magento/* dependencies are resolved from the PUBLIC Mage-OS
# composer mirror (repo.mage-os.org) — no repo.magento.com auth keys needed,
# no secrets in the repo. A green build here is simultaneously proof that
# the module installs against Mage-OS packages.

name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Magento Coding Standard (phpcs.xml ruleset already in repo)
  # ──────────────────────────────────────────────────────────────
  coding-standard:
    name: Magento Coding Standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, mbstring, soap, xsl, zip
          coverage: none

      - name: Allow required composer plugins
        run: |
          composer config --no-plugins allow-plugins.magento/magento-composer-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true

      - name: Use Mage-OS public mirror for magento/* packages
        run: composer config repositories.mage-os composer https://repo.mage-os.org/

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-cs-${{ hashFiles('composer.json') }}
          restore-keys: composer-cs-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run phpcs (Magento2 ruleset)
        run: vendor/bin/phpcs --standard=phpcs.xml --report=checkstyle | cs2pr || vendor/bin/phpcs --standard=phpcs.xml

  # ──────────────────────────────────────────────────────────────
  # PHPStan level 5 (phpstan.neon already in repo)
  # ──────────────────────────────────────────────────────────────
  static-analysis:
    name: PHPStan (level 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, mbstring, soap, xsl, zip
          coverage: none

      - name: Allow required composer plugins
        run: |
          composer config --no-plugins allow-plugins.magento/magento-composer-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true

      - name: Use Mage-OS public mirror for magento/* packages
        run: composer config repositories.mage-os composer https://repo.mage-os.org/

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-stan-${{ hashFiles('composer.json') }}
          restore-keys: composer-stan-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon --no-progress --error-format=github

  # ──────────────────────────────────────────────────────────────
  # Unit tests — PHP matrix mirrors composer.json:
  #   "php": "~8.2.0||~8.3.0||~8.4.0"
  # ──────────────────────────────────────────────────────────────
  unit-tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, soap, xsl, zip
          coverage: none

      - name: Allow required composer plugins
        run: |
          composer config --no-plugins allow-plugins.magento/magento-composer-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true

      - name: Use Mage-OS public mirror for magento/* packages
        run: composer config repositories.mage-os composer https://repo.mage-os.org/

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-test-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-test-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run unit tests
        run: vendor/bin/phpunit -c phpunit.xml --testsuite "Angeo_AeoAudit Unit Tests"

  # ──────────────────────────────────────────────────────────────
  # Installability smoke test: can a bare Mage-OS project actually
  # `composer require` this module? Catches constraint mistakes that
  # unit tests never see. Runs only the composer resolution — fast.
  # ──────────────────────────────────────────────────────────────
  mage-os-install:
    name: Installs on Mage-OS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, mbstring, soap, xsl, zip
          coverage: none

      - name: Create Mage-OS project skeleton (deps resolution only)
        run: |
          composer create-project --repository-url=https://repo.mage-os.org/ \
            mage-os/project-community-edition mageos --no-install --no-interaction
          cd mageos
          composer config --no-plugins allow-plugins true
          composer config repositories.local path ../module
          composer require angeo/module-aeo-audit:@dev --no-install --no-interaction
          composer update --dry-run --no-interaction
